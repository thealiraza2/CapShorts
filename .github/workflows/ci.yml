name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CapShorts/backend/requirements.txt

      - name: Run Backend Unit & Security Tests
        run: |
          python -m unittest discover CapShorts/backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: CapShorts/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: CapShorts/frontend
        run: npm ci

      - name: Typecheck Frontend
        working-directory: CapShorts/frontend
        run: npm run typecheck

      - name: Build Frontend
        working-directory: CapShorts/frontend
        run: npm run build
